name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          command -v jq >/dev/null || brew install jq
          command -v rg >/dev/null || brew install ripgrep

      - name: Validate repository policy and metadata
        run: ./scripts/verify-repository.command

      - name: Run launcher unit tests and production typecheck
        run: ./scripts/test-mactician.command

      - name: Build and test the Android Vulkan buffer-view cache
        run: |
          export TFT_ANDROID_NDK="$ANDROID_HOME/ndk/27.3.13750724"
          if [ ! -f "$TFT_ANDROID_NDK/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724"
          fi
          ./scripts/test-vulkan-view-cache.command

      - name: Reject whitespace and generated changes
        run: |
          git diff --check
          test -z "$(git status --short)"
